name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ""        # las pruebas siempre usan el modo de respaldo, sin llamadas externas
      TEAMS_WEBHOOK_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/api/requirements.txt

      - name: Tests unitarios (almacén, métricas, anonimización, compromisos)
        run: python -m pytest

      - name: Ciclo completo por la API
        run: python -m backend.api.probar_ciclo

      - name: Generación de encuestas (robustez e idiomas)
        run: python -m backend.ia.probar_generar

      - name: Clasificación de comentarios sin IA
        run: python -m backend.ia.probar_analizar

      - name: Traducciones del frontend
        run: python scripts/comprobar_i18n.py
