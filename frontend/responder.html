<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta · Damm</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    /* Formulario de respuesta (contratos/diseno.md §6): fondo blanco, una columna */
    body { background: #FFFFFF; }
    .resp { max-width: 560px; margin: 0 auto; padding: var(--e5) var(--e4) var(--e6); min-height: 100vh; display: flex; flex-direction: column; }
    .resp-marca { font-weight: 700; color: var(--acento); font-size: var(--t-lg); margin-bottom: var(--e5); }
    .resp h1 { font-size: var(--t-xl); margin-bottom: var(--e2); }
    .resp .intro { color: var(--texto-2); margin-bottom: var(--e4); }
    .transparencia { background: var(--gris-fondo); border-radius: var(--radio); padding: var(--e3) var(--e4); font-size: var(--t-sm); color: var(--texto-2); margin-bottom: var(--e5); }
    .transparencia p + p { margin-top: var(--e1); }
    .transparencia .mas { background: none; border: none; padding: 0; margin-top: var(--e2); color: var(--texto); text-decoration: underline; cursor: pointer; font-size: var(--t-sm); }
    .transparencia .completa { margin-top: var(--e3); }
    .transparencia .completa h4 { color: var(--texto); margin: var(--e3) 0 var(--e1); font-size: var(--t-sm); }
    .transparencia .completa ul { padding-left: var(--e4); }
    .transparencia .completa li + li { margin-top: 2px; }

    .progreso { margin-bottom: var(--e5); }
    .progreso-texto { font-size: var(--t-sm); color: var(--texto-2); margin-bottom: var(--e2); }
    .progreso-pista { height: 4px; background: var(--gris-fondo); border-radius: 2px; overflow: hidden; }
    .progreso-relleno { height: 100%; background: var(--texto); transition: width .2s; }

    .enunciado { font-size: var(--t-lg); font-weight: var(--peso-fuerte); line-height: 1.4; margin-bottom: var(--e4); }
    .opciones-resp { display: flex; flex-direction: column; gap: var(--e2); }
    .opcion-resp {
      min-height: 48px; padding: var(--e3) var(--e4);
      border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie);
      text-align: left; font-size: var(--t-md); cursor: pointer;
    }
    .opcion-resp:hover { border-color: var(--texto-3); }
    .opcion-resp[aria-pressed="true"] { border-color: var(--texto); background: var(--texto); color: #FFFFFF; }

    .escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--e2); }
    .escala .opcion-resp { text-align: center; font-size: var(--t-xl); font-weight: var(--peso-fuerte); min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: var(--e2) 0; }
    .escala .cara { width: 28px; height: 28px; display: none; }
    .escala-extremos { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--texto-2); margin-top: var(--e2); }
    .sino { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e2); }
    .sino .opcion-resp { text-align: center; font-weight: var(--peso-medio); min-height: 56px; }

    .resp-pie { display: flex; justify-content: space-between; align-items: center; gap: var(--e2); margin-top: auto; padding-top: var(--e6); }
    .resp-pie .btn { height: 44px; min-width: 120px; }
    .final { text-align: center; margin: auto 0; }
    .final h1 { margin-bottom: var(--e2); }

    /* Quiosco: todo más grande y caritas monocromas en la escala */
    body.quiosco .resp { max-width: 760px; }
    body.quiosco .enunciado { font-size: var(--t-xl); }
    body.quiosco .opcion-resp { min-height: 64px; font-size: var(--t-lg); }
    body.quiosco .escala .opcion-resp { min-height: 96px; }
    body.quiosco .escala .cara { display: block; }
    body.quiosco .resp-pie .btn { height: 56px; min-width: 160px; font-size: var(--t-lg); }

    /* Selector de idioma ES · CA · EN (contratos v3, 6.2) */
    .resp-cabecera { display: flex; justify-content: space-between; align-items: center; gap: var(--e3); margin-bottom: var(--e5); }
    .resp-cabecera .resp-marca { margin-bottom: 0; }
    .idiomas { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--e1); }
    .idioma-btn {
      min-width: 40px; height: 40px; padding: 0 var(--e2);
      border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie);
      font-size: var(--t-sm); font-weight: var(--peso-fuerte); cursor: pointer;
    }
    .idioma-btn:hover { border-color: var(--texto-3); }
    .idioma-btn[aria-pressed="true"] { background: var(--texto); border-color: var(--texto); color: #FFFFFF; }
    body.quiosco .idioma-btn { min-width: 60px; height: 52px; font-size: var(--t-md); }
    .aviso-idioma { margin: calc(-1 * var(--e3)) 0 var(--e4); padding: var(--e2) var(--e3); background: var(--gris-fondo); border-radius: var(--radio); }

    /* "Dijisteis → Hemos hecho" (v6): primera pantalla si hay compromisos para este colectivo */
    .compromisos-resp { display: flex; flex-direction: column; gap: var(--e4); margin: var(--e4) 0 var(--e5); }
    .compromiso-resp { border: 1px solid var(--borde); border-left: 4px solid var(--ok); border-radius: var(--radio); padding: var(--e4); background: var(--superficie); }
    .compromiso-resp.comprometido { border-left-color: var(--texto); }
    .compromiso-resp h2 { font-size: var(--t-sm); font-weight: var(--peso-fuerte); color: var(--texto-2); margin: 0 0 var(--e1); text-transform: none; }
    .compromiso-resp p { margin: 0 0 var(--e3); font-size: var(--t-md); line-height: 1.5; color: var(--texto); }
    .compromiso-resp .hicimos { font-weight: var(--peso-fuerte); }
    .compromiso-resp .desde { margin: 0; font-size: var(--t-sm); color: var(--texto-2); }
    body.quiosco .compromiso-resp p { font-size: var(--t-lg); }
    body.quiosco .compromiso-resp h2 { font-size: var(--t-md); }
  </style>
</head>
<body>
  <main class="resp" id="app" aria-live="polite">
    <div class="resp-marca">Damm</div>
    <p class="cargando">Cargando…</p>
  </main>

  <script type="module">
    import {
      obtenerEncuestaPublica, enviarRespuesta, formatearTurno, formatearColectivo, colectivosDe, preguntasDe
    } from '/js/api.js';
    import { escapar } from '/js/ui.js';
    import { IDIOMAS, ETIQUETAS_IDIOMA, cargarIdioma, idiomaInicial, mayuscula, t } from '/js/i18n.js';

    const app = document.getElementById('app');
    const encuestaId = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || '');
    const parametros = new URLSearchParams(window.location.search);
    const canalUrl = parametros.get('canal');
    const colectivoUrl = parametros.get('colectivo'); // QR de un sector: ?colectivo=planta
    // Canales que se guardan tal cual (v6): quiosco y teams (la tarjeta de Teams abre ?canal=teams); el resto, qr
    const canal = ['quiosco', 'teams'].includes(canalUrl) ? canalUrl : 'qr';
    const esQuiosco = canal === 'quiosco';
    if (esQuiosco) document.body.classList.add('quiosco');

    let encuesta = null;
    let transparencia = { corta: [], completa: '' };
    let estado = null; // { colectivo, turno, valores, indice }
    let sectores = [];  // sectores de la encuesta
    let sectorFijo = null; // si el QR ya indica el sector, no se pregunta
    let idioma = 'es';
    let pantalla = 'inicio'; // inicio | pregunta | final | error: para repintar al cambiar de idioma
    let opcionesOriginales = {}; // id de pregunta -> opciones en castellano (lo que se envía)

    // ---------- Idioma ----------
    // Traducción con respaldo: si falta la clave, el formateador de api.js
    const tr = (clave, respaldo) => { const v = t(clave); return v === clave ? respaldo : v; };
    // Los nombres del diccionario van en minúscula (sirven dentro de una frase): en botones, con mayúscula
    const nombreSector = c => mayuscula(tr(`colectivo.${c}`, formatearColectivo(c)));
    const nombreTurno = tu => mayuscula(tr(`turno.${tu}`, formatearTurno(tu)));

    // Aviso si se pide catalán o inglés y la encuesta aún no tiene esa traducción (v4, P0-4)
    // ---------- "Dijisteis → Hemos hecho" (v6 §4.5 P0-3) ----------
    // Textos de respaldo: si las claves ya están en i18n/<idioma>.json, mandan las de allí
    const RESPALDO_COMP = {
      es: { 'responder.dijisteis': 'Lo que nos dijisteis', 'responder.hemos_hecho': 'Lo que hemos hecho', 'responder.desde': 'Desde el {fecha}',
            'responder.compromisos_titulo': 'Antes de empezar', 'responder.compromisos_intro': 'Vuestras respuestas anteriores han servido para esto:',
            'responder.compromisos_aria': 'Lo que hemos hecho con vuestras respuestas', 'responder.responder': 'Responder', 'responder.hecho': 'Hecho' },
      ca: { 'responder.dijisteis': 'El que ens vau dir', 'responder.hemos_hecho': 'El que hem fet', 'responder.desde': 'Des del {fecha}',
            'responder.compromisos_titulo': 'Abans de començar', 'responder.compromisos_intro': 'Les vostres respostes anteriors han servit per a això:',
            'responder.compromisos_aria': 'El que hem fet amb les vostres respostes', 'responder.responder': 'Respon', 'responder.hecho': 'Fet' },
      en: { 'responder.dijisteis': 'What you told us', 'responder.hemos_hecho': 'What we have done', 'responder.desde': 'Since {fecha}',
            'responder.compromisos_titulo': 'Before you start', 'responder.compromisos_intro': 'Your previous answers led to this:',
            'responder.compromisos_aria': 'What we have done with your answers', 'responder.responder': 'Answer', 'responder.hecho': 'Done' },
    };
    function tc(clave, variables = {}) {
      const texto = t(clave, variables);
      if (texto !== clave) return texto;
      const r = (RESPALDO_COMP[idioma] || RESPALDO_COMP.es)[clave] || clave;
      return r.replace(/\{(\w+)\}/g, (m, v) => (v in variables ? String(variables[v]) : m));
    }
    function fechaCompromiso(fecha) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha || '')) return fecha || '';
      const [a, m, d] = fecha.split('-').map(Number);
      try { return new Intl.DateTimeFormat(idioma, { day: 'numeric', month: 'long' }).format(new Date(a, m - 1, d)); }
      catch { return fecha; }
    }
    const compromisosVisibles = () => (Array.isArray(encuesta?.compromisos) ? encuesta.compromisos.slice(0, 2) : []);

    function pantallaCompromisos() {
      pantalla = 'compromisos';
      const lista = compromisosVisibles();
      app.innerHTML = `
        ${cabecera()}
        <h1>${escapar(tc('responder.compromisos_titulo'))}</h1>
        <p class="intro">${escapar(tc('responder.compromisos_intro'))}</p>
        <div class="compromisos-resp" role="region" aria-label="${escapar(tc('responder.compromisos_aria'))}">
          ${lista.map(c => `
            <article class="compromiso-resp ${c.estado === 'hecho' ? 'hecho' : 'comprometido'}">
              <h2>${escapar(tc('responder.dijisteis'))}</h2>
              <p>${escapar(c.dijisteis || '')}</p>
              <h2>${escapar(tc('responder.hemos_hecho'))}</h2>
              <p class="hicimos">${escapar(c.hicimos || '')}</p>
              ${c.fecha ? `<p class="desde">${escapar(tc('responder.desde', { fecha: fechaCompromiso(c.fecha) }))}${c.estado === 'hecho' ? ` · ${escapar(tc('responder.hecho'))} ✓` : ''}</p>` : ''}
            </article>`).join('')}
        </div>
        <div class="resp-pie">
          <span></span>
          <button type="button" class="btn btn-principal" id="btn-ver-encuesta">${escapar(tc('responder.responder'))}</button>
        </div>`;
      app.querySelector('#btn-ver-encuesta').addEventListener('click', () => {
        estado.vioCompromisos = true;
        pantallaInicio();
        app.querySelector('h1')?.focus?.();
      });
      app.querySelector('#btn-ver-encuesta').focus();
    }

    function avisoSinTraduccion() {
      const disponibles = encuesta?.idiomas_disponibles;
      if (idioma === 'es' || !Array.isArray(disponibles) || disponibles.includes(idioma)) return '';
      return `<p class="nota aviso-idioma" role="status">${escapar(t('responder.sin_traduccion'))}</p>`;
    }

    function cabecera() {
      return `
        <div class="resp-cabecera">
          <div class="resp-marca">Damm</div>
          <div class="idiomas" role="group" aria-label="${escapar(t('idioma.selector'))}">
            ${IDIOMAS.map(c => `<button type="button" class="idioma-btn" data-idioma="${c}" aria-pressed="${idioma === c}" lang="${c}">${ETIQUETAS_IDIOMA[c] || c.toUpperCase()}</button>`).join('')}
          </div>
        </div>
        ${avisoSinTraduccion()}`;
    }

    // Opciones en castellano por id: en "opcion" se muestra la traducción y se envía el original
    function guardarOpcionesOriginales(enc) {
      opcionesOriginales = {};
      const todas = [...(enc.preguntas || []), ...Object.values(enc.preguntas_por_colectivo || {}).flat()];
      todas.forEach(p => { if (p.tipo === 'opcion') opcionesOriginales[p.id] = p.opciones || []; });
    }
    const valorOpcion = (p, i) => (opcionesOriginales[p.id] || [])[i] ?? (p.opciones || [])[i];

    function aplicarEncuesta(enc) {
      encuesta = enc;
      transparencia = prepararTransparencia(enc.transparencia);
    }

    async function cambiarIdioma(codigo) {
      if (codigo === idioma || !IDIOMAS.includes(codigo)) return;
      idioma = await cargarIdioma(codigo);
      try {
        aplicarEncuesta(await obtenerEncuestaPublica(encuestaId, idioma));
      } catch { /* sin traducción: se mantienen los textos actuales */ }
      // Se conservan sector, turno, respuestas y pregunta actual
      if (pantalla === 'pregunta') pantallaPregunta();
      else if (pantalla === 'compromisos') pantallaCompromisos();
      else if (pantalla === 'final') pantallaFinal(false);
      else if (pantalla === 'error') pantallaError();
      else pantallaInicio();
    }

    app.addEventListener('click', e => {
      const boton = e.target.closest('[data-idioma]');
      if (boton) cambiarIdioma(boton.dataset.idioma);
    });

    // ---------- Texto de transparencia ----------
    // El servidor envía contenido/transparencia.md. Si es el documento completo,
    // se usa la versión corta en castellano y la completa va en "Más información".
    function limpiar(linea) {
      return linea.replace(/^>\s?/, '')
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{FE0F}]/gu, '')
        .replace(/\*\*/g, '').trim();
    }
    function mdABloques(md) {
      const html = [];
      let lista = false;
      md.split('\n').forEach(l => {
        const t = l.trim();
        if (!t || t === '---') { if (lista) { html.push('</ul>'); lista = false; } return; }
        if (t.startsWith('### ')) { if (lista) { html.push('</ul>'); lista = false; } html.push(`<h4>${escapar(limpiar(t.slice(4)))}</h4>`); return; }
        if (t.startsWith('- ')) { if (!lista) { html.push('<ul>'); lista = true; } html.push(`<li>${escapar(limpiar(t.slice(2)))}</li>`); return; }
        if (lista) { html.push('</ul>'); lista = false; }
        html.push(`<p>${escapar(limpiar(t))}</p>`);
      });
      if (lista) html.push('</ul>');
      return html.join('');
    }
    function prepararTransparencia(texto) {
      const md = String(texto || '').replace(/\r/g, '');
      // Formato actual: sección "## Castellano" con dos frases y una lista de garantías
      const castellano = md.match(/^##\s*(?:Castellano|Català|Catala|English)[^\n]*\n([\s\S]*?)(?=^##\s|(?![\s\S]))/m);
      if (castellano) {
        const lineas = castellano[1].split('\n').map(l => l.trim()).filter(Boolean);
        const frases = lineas.filter(l => !l.startsWith('- ') && !l.startsWith('>')).map(limpiar).filter(Boolean);
        const lista = lineas.filter(l => l.startsWith('- ')).map(l => limpiar(l.slice(2))).filter(Boolean);
        return {
          corta: frases.slice(0, 2),
          completa: [
            ...frases.slice(2).map(f => `<p>${escapar(f)}</p>`),
            lista.length ? `<ul>${lista.map(l => `<li>${escapar(l)}</li>`).join('')}</ul>` : '',
          ].join(''),
        };
      }
      if (!/^##\s/m.test(md)) {
        const frases = md.split(/(?<=\.)\s+/).map(s => s.trim()).filter(Boolean);
        return { corta: frases.slice(0, 2), completa: frases.slice(2).length ? `<p>${escapar(frases.slice(2).join(' '))}</p>` : '' };
      }
      const seccion = n => {
        const m = md.match(new RegExp(`^##\\s*${n}\\.[^\\n]*\\n([\\s\\S]*?)(?=^##\\s|$(?![\\s\\S]))`, 'm'));
        return m ? m[1] : '';
      };
      // Versión corta: primer bloque citado tras "**ES**" en la sección 2
      const corta = seccion(2);
      const es = (corta.split(/\*\*CA\*\*/)[0] || '').split('\n').filter(l => l.trim().startsWith('>')).map(limpiar).filter(Boolean);
      const completa = seccion(3).split(/^##\s/m)[0];
      return { corta: es.slice(0, 2), completa: mdABloques(completa) };
    }

    // ---------- Preguntas visibles (respetando las condiciones) ----------
    // Núcleo común + preguntas propias del sector elegido (contratos v2, 1.1).
    // La pregunta abierta del núcleo se muestra al final, después de las del sector.
    const preguntasSector = () => {
      const todas = preguntasDe(encuesta, estado.colectivo);
      return [...todas.filter(p => p.tipo !== 'texto'), ...todas.filter(p => p.tipo === 'texto')];
    };

    function visibles() {
      return preguntasSector().filter(p => {
        if (!p.condicion) return true;
        const v = estado.valores[p.condicion.pregunta];
        return typeof v === 'number' && v <= p.condicion.valor_max;
      });
    }
    const obligatoria = p => p.tipo !== 'texto';
    const contestada = p => {
      const v = estado.valores[p.id];
      return v !== undefined && v !== null && v !== '';
    };

    // ---------- Pantallas ----------
    function turnosDelSector() {
      if (!estado.colectivo) return [];
      return (encuesta.turnos_por_colectivo || {})[estado.colectivo] || encuesta.turnos || ['sin_turno'];
    }

    function pantallaInicio() {
      pantalla = 'inicio';
      const preguntarSector = sectores.length > 1 && !sectorFijo;
      const turnos = turnosDelSector();
      if (turnos.length === 1) estado.turno = turnos[0];
      else if (!turnos.includes(estado.turno)) estado.turno = null;
      const listo = !!estado.colectivo && !!estado.turno;
      const n = estado.colectivo ? preguntasSector().length : null;
      const tp = transparencia; // (no se llama "t": es la función de traducción)
      app.innerHTML = `
        ${cabecera()}
        <h1>${escapar(encuesta.titulo)}</h1>
        <p class="intro">${escapar(encuesta.intro || '')}</p>
        <div class="transparencia">
          ${tp.corta.map(l => `<p>${escapar(l)}</p>`).join('')}
          ${tp.completa ? `<button type="button" class="mas" id="btn-mas" aria-expanded="false">${escapar(t('responder.mas_info'))}</button>
            <div class="completa oculto" id="texto-completo">${tp.completa}</div>` : ''}
        </div>
        ${preguntarSector ? `
          <p class="enunciado" id="titulo-sector">${escapar(t('responder.donde_trabajas'))}</p>
          <div class="opciones-resp sectores-resp" role="group" aria-labelledby="titulo-sector">
            ${sectores.map(c => `<button type="button" class="opcion-resp" data-sector="${escapar(c)}" aria-pressed="${estado.colectivo === c}">${escapar(nombreSector(c))}</button>`).join('')}
          </div>` : ''}
        ${turnos.length > 1 ? `
          <p class="enunciado" id="titulo-turno" style="${preguntarSector ? 'margin-top: var(--e5);' : ''}">${escapar(t('responder.que_turno'))}</p>
          <div class="opciones-resp" role="group" aria-labelledby="titulo-turno">
            ${turnos.map(tu => `<button type="button" class="opcion-resp" data-turno="${escapar(tu)}" aria-pressed="${estado.turno === tu}">${escapar(nombreTurno(tu))}</button>`).join('')}
          </div>` : ''}
        <div class="resp-pie">
          <span class="nota">${n ? t('responder.n_preguntas', { n }) : ''}${t('responder.duracion', { min: Math.max(1, Math.ceil((encuesta.tiempo_estimado_seg || 60) / 60)) })}</span>
          <button type="button" class="btn btn-principal" id="btn-empezar" ${listo ? '' : 'disabled'}>${escapar(t('responder.empezar'))}</button>
        </div>`;

      document.getElementById('btn-mas')?.addEventListener('click', e => {
        const abierto = e.target.getAttribute('aria-expanded') === 'true';
        e.target.setAttribute('aria-expanded', String(!abierto));
        e.target.textContent = abierto ? t('responder.mas_info') : t('responder.menos_info');
        document.getElementById('texto-completo').classList.toggle('oculto', abierto);
      });
      app.querySelectorAll('[data-sector]').forEach(b => b.addEventListener('click', () => {
        if (estado.colectivo !== b.dataset.sector) {
          estado.colectivo = b.dataset.sector;
          estado.turno = null;
          estado.valores = {}; // las preguntas propias cambian con el sector
        }
        pantallaInicio();
        // En el móvil, llevar la vista a la pregunta del turno
        document.getElementById('titulo-turno')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }));
      app.querySelectorAll('[data-turno]').forEach(b => b.addEventListener('click', () => {
        estado.turno = b.dataset.turno;
        app.querySelectorAll('[data-turno]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        document.getElementById('btn-empezar').disabled = !estado.colectivo;
      }));
      document.getElementById('btn-empezar').addEventListener('click', () => { estado.indice = 0; pantallaPregunta(); });
    }

    const CARAS = [
      '<path d="M8 16s1.5-2 4-2 4 2 4 2"/>',
      '<path d="M8 15.5s1.5-1 4-1 4 1 4 1"/>',
      '<line x1="8" y1="15" x2="16" y2="15"/>',
      '<path d="M8 14.5s1.5 1 4 1 4-1 4-1"/>',
      '<path d="M8 14s1.5 2 4 2 4-2 4-2"/>',
    ].map(boca => `<svg class="cara" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="9" y1="9.5" x2="9" y2="9.6"/><line x1="15" y1="9.5" x2="15" y2="9.6"/>${boca}</svg>`);

    function controlPregunta(p) {
      const v = estado.valores[p.id];
      if (p.tipo === 'escala_1_5') {
        return `
          <div class="escala" role="group" aria-label="${escapar(t('escala.grupo'))}">
            ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="opcion-resp" data-valor="${n}" aria-pressed="${v === n}" aria-label="${escapar(t('escala.n_de_5', { n, texto: t(`escala.${n}`) }))}" title="${escapar(t(`escala.${n}`))}">${CARAS[n - 1]}<span>${n}</span></button>`).join('')}
          </div>
          <div class="escala-extremos"><span>${escapar(t('escala.1'))}</span><span>${escapar(t('escala.5'))}</span></div>`;
      }
      if (p.tipo === 'si_no') {
        return `<div class="sino" role="group">
          <button type="button" class="opcion-resp" data-valor="si" aria-pressed="${v === 'si'}">${escapar(t('responder.si'))}</button>
          <button type="button" class="opcion-resp" data-valor="no" aria-pressed="${v === 'no'}">${escapar(t('responder.no'))}</button>
        </div>`;
      }
      if (p.tipo === 'opcion') {
        return `<div class="opciones-resp" role="group">
          ${(p.opciones || []).map((o, i) => `<button type="button" class="opcion-resp" data-valor="${escapar(valorOpcion(p, i))}" aria-pressed="${v === valorOpcion(p, i)}">${escapar(o)}</button>`).join('')}
        </div>`;
      }
      return `
        <label class="sr-only" for="texto-libre">${escapar(t('responder.tu_respuesta'))}</label>
        <textarea id="texto-libre" class="area" rows="5" maxlength="1000" placeholder="${escapar(t('responder.opcional'))}">${escapar(v || '')}</textarea>
        <p class="nota" style="margin-top: var(--e2);">${escapar(t('responder.sin_datos'))}</p>`;
    }

    function pantallaPregunta() {
      pantalla = 'pregunta';
      const lista = visibles();
      estado.indice = Math.min(estado.indice, lista.length - 1);
      const p = lista[estado.indice];
      const ultima = estado.indice === lista.length - 1;
      const pct = Math.round(((estado.indice + 1) / lista.length) * 100);
      const puedeSeguir = !obligatoria(p) || contestada(p);
      const todasListas = lista.filter(obligatoria).every(contestada);

      app.innerHTML = `
        ${cabecera()}
        <div class="progreso">
          <div class="progreso-texto">${escapar(t('responder.pregunta_n', { n: estado.indice + 1, total: lista.length }))}</div>
          <div class="progreso-pista"><div class="progreso-relleno" style="width: ${pct}%"></div></div>
        </div>
        <p class="enunciado" id="enunciado">${escapar(p.texto)}</p>
        <div aria-labelledby="enunciado">${controlPregunta(p)}</div>
        <div id="error-envio" class="aviso error oculto" role="alert" style="margin-top: var(--e4);"></div>
        <div class="resp-pie">
          <button type="button" class="btn btn-secundario" id="btn-atras">${escapar(t('responder.atras'))}</button>
          ${ultima
            ? `<button type="button" class="btn btn-principal" id="btn-enviar" ${todasListas ? '' : 'disabled'}>${escapar(t('responder.enviar'))}</button>`
            : `<button type="button" class="btn btn-principal" id="btn-siguiente" ${puedeSeguir ? '' : 'disabled'}>${escapar(t('responder.siguiente'))}</button>`}
        </div>`;

      app.querySelectorAll('[data-valor]').forEach(b => b.addEventListener('click', () => {
        estado.valores[p.id] = p.tipo === 'escala_1_5' ? Number(b.dataset.valor) : b.dataset.valor;
        // Si cambia la respuesta, las preguntas que ya no aplican se descartan
        preguntasSector().forEach(x => {
          if (x.condicion?.pregunta === p.id && !visibles().includes(x)) delete estado.valores[x.id];
        });
        const listaNueva = visibles();
        if (estado.indice < listaNueva.length - 1) {
          setTimeout(() => { estado.indice += 1; pantallaPregunta(); }, 180);
        } else {
          pantallaPregunta();
        }
      }));
      document.getElementById('texto-libre')?.addEventListener('input', e => { estado.valores[p.id] = e.target.value; });
      document.getElementById('btn-atras').addEventListener('click', () => {
        if (estado.indice === 0) pantallaInicio(); else { estado.indice -= 1; pantallaPregunta(); }
      });
      document.getElementById('btn-siguiente')?.addEventListener('click', () => { estado.indice += 1; pantallaPregunta(); });
      document.getElementById('btn-enviar')?.addEventListener('click', enviar);
    }

    async function enviar() {
      const boton = document.getElementById('btn-enviar');
      boton.disabled = true;
      boton.textContent = t('responder.enviando');
      // Solo las preguntas que se han mostrado; el texto libre lo guarda el servidor como comentario
      const valores = {};
      visibles().forEach(p => {
        const v = estado.valores[p.id];
        if (v === undefined || v === null) return;
        if (typeof v === 'string' && !v.trim()) return;
        valores[p.id] = typeof v === 'string' ? v.trim() : v;
      });
      try {
        await enviarRespuesta(encuestaId, { colectivo: estado.colectivo, turno: estado.turno, canal, valores, idioma });
        pantallaFinal();
      } catch (err) {
        const caja = document.getElementById('error-envio');
        caja.textContent = t('responder.error_envio', { error: err.message });
        caja.classList.remove('oculto');
        boton.disabled = false;
        boton.textContent = t('responder.enviar');
      }
    }

    function pantallaFinal(programarReinicio = true) {
      pantalla = 'final';
      app.innerHTML = `
        ${cabecera()}
        <div class="final">
          <h1>${escapar(t('responder.gracias'))}</h1>
          <p class="texto-2">${escapar(t('responder.gracias_texto'))}</p>
          ${esQuiosco ? `<p class="nota" style="margin-top: var(--e4);">${escapar(t('responder.reinicio'))}</p>` : ''}
        </div>`;
      // En quiosco se reinicia manteniendo el idioma elegido
      if (esQuiosco && programarReinicio) setTimeout(reiniciar, 5000);
    }

    function pantallaError() {
      pantalla = 'error';
      app.innerHTML = `
        ${cabecera()}
        <div class="final">
          <h1>${escapar(t('responder.no_disponible'))}</h1>
          <p class="texto-2">${escapar(t('responder.no_disponible_texto'))}</p>
        </div>`;
    }

    function reiniciar() {
      // En quiosco se vuelve a preguntar el sector, salvo que el QR lo indique
      estado = { colectivo: sectorFijo || (sectores.length === 1 ? sectores[0] : null), turno: null, valores: {}, indice: 0, vioCompromisos: false };
      // Primera pantalla: lo que se ha hecho con las respuestas anteriores (también en cada reinicio del quiosco)
      if (compromisosVisibles().length) pantallaCompromisos();
      else pantallaInicio();
    }

    async function iniciar() {
      idioma = await cargarIdioma(idiomaInicial());
      try {
        // La versión en castellano da las opciones originales que se envían
        const original = await obtenerEncuestaPublica(encuestaId, 'es');
        guardarOpcionesOriginales(original);
        let enc = original;
        if (idioma !== 'es') {
          try { enc = await obtenerEncuestaPublica(encuestaId, idioma); } catch { /* se queda en castellano */ }
        }
        aplicarEncuesta(enc);
        sectores = colectivosDe(encuesta);
        sectorFijo = sectores.includes(colectivoUrl) ? colectivoUrl : null;
        reiniciar();
      } catch (err) {
        console.error('No se pudo cargar la encuesta:', err);
        pantallaError();
      }
    }

    iniciar();
  </script>
</body>
</html>
