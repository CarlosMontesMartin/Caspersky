<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta · Damm</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    /* Formulario de respuesta (contratos/diseno.md §6): fondo blanco, una columna */
    body { background: #FFFFFF; }
    .resp { max-width: 560px; margin: 0 auto; padding: var(--e5) var(--e4) var(--e6); min-height: 100vh; display: flex; flex-direction: column; }
    .resp-marca { font-weight: 700; color: var(--acento); font-size: var(--t-lg); margin-bottom: var(--e5); }
    .resp h1 { font-size: var(--t-xl); margin-bottom: var(--e2); }
    .resp .intro { color: var(--texto-2); margin-bottom: var(--e4); }
    .transparencia { background: var(--gris-fondo); border-radius: var(--radio); padding: var(--e3) var(--e4); font-size: var(--t-sm); color: var(--texto-2); margin-bottom: var(--e5); }
    .transparencia p + p { margin-top: var(--e1); }
    .transparencia .mas { background: none; border: none; padding: 0; margin-top: var(--e2); color: var(--texto); text-decoration: underline; cursor: pointer; font-size: var(--t-sm); }
    .transparencia .completa { margin-top: var(--e3); }
    .transparencia .completa h4 { color: var(--texto); margin: var(--e3) 0 var(--e1); font-size: var(--t-sm); }
    .transparencia .completa ul { padding-left: var(--e4); }
    .transparencia .completa li + li { margin-top: 2px; }

    .progreso { margin-bottom: var(--e5); }
    .progreso-texto { font-size: var(--t-sm); color: var(--texto-2); margin-bottom: var(--e2); }
    .progreso-pista { height: 4px; background: var(--gris-fondo); border-radius: 2px; overflow: hidden; }
    .progreso-relleno { height: 100%; background: var(--texto); transition: width .2s; }

    .enunciado { font-size: var(--t-lg); font-weight: var(--peso-fuerte); line-height: 1.4; margin-bottom: var(--e4); }
    .opciones-resp { display: flex; flex-direction: column; gap: var(--e2); }
    .opcion-resp {
      min-height: 48px; padding: var(--e3) var(--e4);
      border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie);
      text-align: left; font-size: var(--t-md); cursor: pointer;
    }
    .opcion-resp:hover { border-color: var(--texto-3); }
    .opcion-resp[aria-pressed="true"] { border-color: var(--texto); background: var(--texto); color: #FFFFFF; }

    .escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--e2); }
    .escala .opcion-resp { text-align: center; font-size: var(--t-xl); font-weight: var(--peso-fuerte); min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: var(--e2) 0; }
    .escala .cara { width: 28px; height: 28px; display: none; }
    .escala-extremos { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--texto-2); margin-top: var(--e2); }
    .sino { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e2); }
    .sino .opcion-resp { text-align: center; font-weight: var(--peso-medio); min-height: 56px; }

    .resp-pie { display: flex; justify-content: space-between; align-items: center; gap: var(--e2); margin-top: auto; padding-top: var(--e6); }
    .resp-pie .btn { height: 44px; min-width: 120px; }
    .final { text-align: center; margin: auto 0; }
    .final h1 { margin-bottom: var(--e2); }

    /* Quiosco: todo más grande y caritas monocromas en la escala */
    body.quiosco .resp { max-width: 760px; }
    body.quiosco .enunciado { font-size: var(--t-xl); }
    body.quiosco .opcion-resp { min-height: 64px; font-size: var(--t-lg); }
    body.quiosco .escala .opcion-resp { min-height: 96px; }
    body.quiosco .escala .cara { display: block; }
    body.quiosco .resp-pie .btn { height: 56px; min-width: 160px; font-size: var(--t-lg); }
  </style>
</head>
<body>
  <main class="resp" id="app" aria-live="polite">
    <div class="resp-marca">Damm</div>
    <p class="cargando">Cargando…</p>
  </main>

  <script type="module">
    import {
      obtenerEncuestaPublica, enviarRespuesta, formatearTurno, formatearColectivo, colectivosDe, preguntasDe
    } from '/js/api.js';
    import { escapar } from '/js/ui.js';

    const app = document.getElementById('app');
    const encuestaId = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || '');
    const parametros = new URLSearchParams(window.location.search);
    const canalUrl = parametros.get('canal');
    const colectivoUrl = parametros.get('colectivo'); // QR de un sector: ?colectivo=planta
    const canal = canalUrl === 'quiosco' ? 'quiosco' : 'qr';
    const esQuiosco = canal === 'quiosco';
    if (esQuiosco) document.body.classList.add('quiosco');

    let encuesta = null;
    let transparencia = { corta: [], completa: '' };
    let estado = null; // { colectivo, turno, valores, indice }
    let sectores = [];  // sectores de la encuesta
    let sectorFijo = null; // si el QR ya indica el sector, no se pregunta

    // ---------- Texto de transparencia ----------
    // El servidor envía contenido/transparencia.md. Si es el documento completo,
    // se usa la versión corta en castellano y la completa va en "Más información".
    function limpiar(linea) {
      return linea.replace(/^>\s?/, '')
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{FE0F}]/gu, '')
        .replace(/\*\*/g, '').trim();
    }
    function mdABloques(md) {
      const html = [];
      let lista = false;
      md.split('\n').forEach(l => {
        const t = l.trim();
        if (!t || t === '---') { if (lista) { html.push('</ul>'); lista = false; } return; }
        if (t.startsWith('### ')) { if (lista) { html.push('</ul>'); lista = false; } html.push(`<h4>${escapar(limpiar(t.slice(4)))}</h4>`); return; }
        if (t.startsWith('- ')) { if (!lista) { html.push('<ul>'); lista = true; } html.push(`<li>${escapar(limpiar(t.slice(2)))}</li>`); return; }
        if (lista) { html.push('</ul>'); lista = false; }
        html.push(`<p>${escapar(limpiar(t))}</p>`);
      });
      if (lista) html.push('</ul>');
      return html.join('');
    }
    function prepararTransparencia(texto) {
      const md = String(texto || '').replace(/\r/g, '');
      // Formato actual: sección "## Castellano" con dos frases y una lista de garantías
      const castellano = md.match(/^##\s*Castellano[^\n]*\n([\s\S]*?)(?=^##\s|(?![\s\S]))/m);
      if (castellano) {
        const lineas = castellano[1].split('\n').map(l => l.trim()).filter(Boolean);
        const frases = lineas.filter(l => !l.startsWith('- ') && !l.startsWith('>')).map(limpiar).filter(Boolean);
        const lista = lineas.filter(l => l.startsWith('- ')).map(l => limpiar(l.slice(2))).filter(Boolean);
        return {
          corta: frases.slice(0, 2),
          completa: [
            ...frases.slice(2).map(f => `<p>${escapar(f)}</p>`),
            lista.length ? `<ul>${lista.map(l => `<li>${escapar(l)}</li>`).join('')}</ul>` : '',
          ].join(''),
        };
      }
      if (!/^##\s/m.test(md)) {
        const frases = md.split(/(?<=\.)\s+/).map(s => s.trim()).filter(Boolean);
        return { corta: frases.slice(0, 2), completa: frases.slice(2).length ? `<p>${escapar(frases.slice(2).join(' '))}</p>` : '' };
      }
      const seccion = n => {
        const m = md.match(new RegExp(`^##\\s*${n}\\.[^\\n]*\\n([\\s\\S]*?)(?=^##\\s|$(?![\\s\\S]))`, 'm'));
        return m ? m[1] : '';
      };
      // Versión corta: primer bloque citado tras "**ES**" en la sección 2
      const corta = seccion(2);
      const es = (corta.split(/\*\*CA\*\*/)[0] || '').split('\n').filter(l => l.trim().startsWith('>')).map(limpiar).filter(Boolean);
      const completa = seccion(3).split(/^##\s/m)[0];
      return { corta: es.slice(0, 2), completa: mdABloques(completa) };
    }

    // ---------- Preguntas visibles (respetando las condiciones) ----------
    // Núcleo común + preguntas propias del sector elegido (contratos v2, 1.1).
    // La pregunta abierta del núcleo se muestra al final, después de las del sector.
    const preguntasSector = () => {
      const todas = preguntasDe(encuesta, estado.colectivo);
      return [...todas.filter(p => p.tipo !== 'texto'), ...todas.filter(p => p.tipo === 'texto')];
    };

    function visibles() {
      return preguntasSector().filter(p => {
        if (!p.condicion) return true;
        const v = estado.valores[p.condicion.pregunta];
        return typeof v === 'number' && v <= p.condicion.valor_max;
      });
    }
    const obligatoria = p => p.tipo !== 'texto';
    const contestada = p => {
      const v = estado.valores[p.id];
      return v !== undefined && v !== null && v !== '';
    };

    // ---------- Pantallas ----------
    function turnosDelSector() {
      if (!estado.colectivo) return [];
      return (encuesta.turnos_por_colectivo || {})[estado.colectivo] || encuesta.turnos || ['sin_turno'];
    }

    function pantallaInicio() {
      const preguntarSector = sectores.length > 1 && !sectorFijo;
      const turnos = turnosDelSector();
      if (turnos.length === 1) estado.turno = turnos[0];
      else if (!turnos.includes(estado.turno)) estado.turno = null;
      const listo = !!estado.colectivo && !!estado.turno;
      const n = estado.colectivo ? preguntasSector().length : null;
      const t = transparencia;
      app.innerHTML = `
        <div class="resp-marca">Damm</div>
        <h1>${escapar(encuesta.titulo)}</h1>
        <p class="intro">${escapar(encuesta.intro || '')}</p>
        <div class="transparencia">
          ${t.corta.map(l => `<p>${escapar(l)}</p>`).join('')}
          ${t.completa ? `<button type="button" class="mas" id="btn-mas" aria-expanded="false">Más información</button>
            <div class="completa oculto" id="texto-completo">${t.completa}</div>` : ''}
        </div>
        ${preguntarSector ? `
          <p class="enunciado" id="titulo-sector">¿Dónde trabajas?</p>
          <div class="opciones-resp sectores-resp" role="group" aria-labelledby="titulo-sector">
            ${sectores.map(c => `<button type="button" class="opcion-resp" data-sector="${escapar(c)}" aria-pressed="${estado.colectivo === c}">${escapar(formatearColectivo(c))}</button>`).join('')}
          </div>` : ''}
        ${turnos.length > 1 ? `
          <p class="enunciado" id="titulo-turno" style="${preguntarSector ? 'margin-top: var(--e5);' : ''}">¿En qué turno trabajas?</p>
          <div class="opciones-resp" role="group" aria-labelledby="titulo-turno">
            ${turnos.map(tu => `<button type="button" class="opcion-resp" data-turno="${escapar(tu)}" aria-pressed="${estado.turno === tu}">${escapar(formatearTurno(tu))}</button>`).join('')}
          </div>` : ''}
        <div class="resp-pie">
          <span class="nota">${n ? `${n} preguntas · ` : ''}menos de ${Math.max(1, Math.ceil((encuesta.tiempo_estimado_seg || 60) / 60))} min</span>
          <button type="button" class="btn btn-principal" id="btn-empezar" ${listo ? '' : 'disabled'}>Empezar</button>
        </div>`;

      document.getElementById('btn-mas')?.addEventListener('click', e => {
        const abierto = e.target.getAttribute('aria-expanded') === 'true';
        e.target.setAttribute('aria-expanded', String(!abierto));
        e.target.textContent = abierto ? 'Más información' : 'Menos información';
        document.getElementById('texto-completo').classList.toggle('oculto', abierto);
      });
      app.querySelectorAll('[data-sector]').forEach(b => b.addEventListener('click', () => {
        if (estado.colectivo !== b.dataset.sector) {
          estado.colectivo = b.dataset.sector;
          estado.turno = null;
          estado.valores = {}; // las preguntas propias cambian con el sector
        }
        pantallaInicio();
        // En el móvil, llevar la vista a la pregunta del turno
        document.getElementById('titulo-turno')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }));
      app.querySelectorAll('[data-turno]').forEach(b => b.addEventListener('click', () => {
        estado.turno = b.dataset.turno;
        app.querySelectorAll('[data-turno]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        document.getElementById('btn-empezar').disabled = !estado.colectivo;
      }));
      document.getElementById('btn-empezar').addEventListener('click', () => { estado.indice = 0; pantallaPregunta(); });
    }

    const CARAS = [
      '<path d="M8 16s1.5-2 4-2 4 2 4 2"/>',
      '<path d="M8 15.5s1.5-1 4-1 4 1 4 1"/>',
      '<line x1="8" y1="15" x2="16" y2="15"/>',
      '<path d="M8 14.5s1.5 1 4 1 4-1 4-1"/>',
      '<path d="M8 14s1.5 2 4 2 4-2 4-2"/>',
    ].map(boca => `<svg class="cara" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="9" y1="9.5" x2="9" y2="9.6"/><line x1="15" y1="9.5" x2="15" y2="9.6"/>${boca}</svg>`);

    function controlPregunta(p) {
      const v = estado.valores[p.id];
      if (p.tipo === 'escala_1_5') {
        return `
          <div class="escala" role="group" aria-label="Valoración de 1 a 5">
            ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="opcion-resp" data-valor="${n}" aria-pressed="${v === n}" aria-label="${n} de 5">${CARAS[n - 1]}<span>${n}</span></button>`).join('')}
          </div>
          <div class="escala-extremos"><span>Muy mal</span><span>Muy bien</span></div>`;
      }
      if (p.tipo === 'si_no') {
        return `<div class="sino" role="group">
          <button type="button" class="opcion-resp" data-valor="si" aria-pressed="${v === 'si'}">Sí</button>
          <button type="button" class="opcion-resp" data-valor="no" aria-pressed="${v === 'no'}">No</button>
        </div>`;
      }
      if (p.tipo === 'opcion') {
        return `<div class="opciones-resp" role="group">
          ${(p.opciones || []).map(o => `<button type="button" class="opcion-resp" data-valor="${escapar(o)}" aria-pressed="${v === o}">${escapar(o)}</button>`).join('')}
        </div>`;
      }
      return `
        <label class="sr-only" for="texto-libre">Tu respuesta</label>
        <textarea id="texto-libre" class="area" rows="5" maxlength="1000" placeholder="Opcional">${escapar(v || '')}</textarea>
        <p class="nota" style="margin-top: var(--e2);">No escribas nombres ni datos personales.</p>`;
    }

    function pantallaPregunta() {
      const lista = visibles();
      estado.indice = Math.min(estado.indice, lista.length - 1);
      const p = lista[estado.indice];
      const ultima = estado.indice === lista.length - 1;
      const pct = Math.round(((estado.indice + 1) / lista.length) * 100);
      const puedeSeguir = !obligatoria(p) || contestada(p);
      const todasListas = lista.filter(obligatoria).every(contestada);

      app.innerHTML = `
        <div class="resp-marca">Damm</div>
        <div class="progreso">
          <div class="progreso-texto">Pregunta ${estado.indice + 1} de ${lista.length}</div>
          <div class="progreso-pista"><div class="progreso-relleno" style="width: ${pct}%"></div></div>
        </div>
        <p class="enunciado" id="enunciado">${escapar(p.texto)}</p>
        <div aria-labelledby="enunciado">${controlPregunta(p)}</div>
        <div id="error-envio" class="aviso error oculto" role="alert" style="margin-top: var(--e4);"></div>
        <div class="resp-pie">
          <button type="button" class="btn btn-secundario" id="btn-atras">Atrás</button>
          ${ultima
            ? `<button type="button" class="btn btn-principal" id="btn-enviar" ${todasListas ? '' : 'disabled'}>Enviar</button>`
            : `<button type="button" class="btn btn-principal" id="btn-siguiente" ${puedeSeguir ? '' : 'disabled'}>Siguiente</button>`}
        </div>`;

      app.querySelectorAll('[data-valor]').forEach(b => b.addEventListener('click', () => {
        estado.valores[p.id] = p.tipo === 'escala_1_5' ? Number(b.dataset.valor) : b.dataset.valor;
        // Si cambia la respuesta, las preguntas que ya no aplican se descartan
        preguntasSector().forEach(x => {
          if (x.condicion?.pregunta === p.id && !visibles().includes(x)) delete estado.valores[x.id];
        });
        const listaNueva = visibles();
        if (estado.indice < listaNueva.length - 1) {
          setTimeout(() => { estado.indice += 1; pantallaPregunta(); }, 180);
        } else {
          pantallaPregunta();
        }
      }));
      document.getElementById('texto-libre')?.addEventListener('input', e => { estado.valores[p.id] = e.target.value; });
      document.getElementById('btn-atras').addEventListener('click', () => {
        if (estado.indice === 0) pantallaInicio(); else { estado.indice -= 1; pantallaPregunta(); }
      });
      document.getElementById('btn-siguiente')?.addEventListener('click', () => { estado.indice += 1; pantallaPregunta(); });
      document.getElementById('btn-enviar')?.addEventListener('click', enviar);
    }

    async function enviar() {
      const boton = document.getElementById('btn-enviar');
      boton.disabled = true;
      boton.textContent = 'Enviando…';
      // Solo las preguntas que se han mostrado; el texto libre lo guarda el servidor como comentario
      const valores = {};
      visibles().forEach(p => {
        const v = estado.valores[p.id];
        if (v === undefined || v === null) return;
        if (typeof v === 'string' && !v.trim()) return;
        valores[p.id] = typeof v === 'string' ? v.trim() : v;
      });
      try {
        await enviarRespuesta(encuestaId, { colectivo: estado.colectivo, turno: estado.turno, canal, valores });
        pantallaFinal();
      } catch (err) {
        const caja = document.getElementById('error-envio');
        caja.textContent = `No se pudo enviar: ${err.message}`;
        caja.classList.remove('oculto');
        boton.disabled = false;
        boton.textContent = 'Enviar';
      }
    }

    function pantallaFinal() {
      app.innerHTML = `
        <div class="resp-marca">Damm</div>
        <div class="final">
          <h1>Gracias</h1>
          <p class="texto-2">Tu respuesta se ha registrado de forma anónima.</p>
          ${esQuiosco ? '<p class="nota" style="margin-top: var(--e4);">La pantalla se reiniciará en unos segundos.</p>' : ''}
        </div>`;
      if (esQuiosco) setTimeout(reiniciar, 5000);
    }

    function reiniciar() {
      // En quiosco se vuelve a preguntar el sector, salvo que el QR lo indique
      estado = { colectivo: sectorFijo || (sectores.length === 1 ? sectores[0] : null), turno: null, valores: {}, indice: 0 };
      pantallaInicio();
    }

    async function iniciar() {
      try {
        encuesta = await obtenerEncuestaPublica(encuestaId);
        sectores = colectivosDe(encuesta);
        sectorFijo = sectores.includes(colectivoUrl) ? colectivoUrl : null;
        transparencia = prepararTransparencia(encuesta.transparencia);
        reiniciar();
      } catch (err) {
        app.innerHTML = `
          <div class="resp-marca">Damm</div>
          <div class="final">
            <h1>Encuesta no disponible</h1>
            <p class="texto-2">Esta encuesta no existe o ya no está abierta.</p>
          </div>`;
      }
    }

    iniciar();
  </script>
</body>
</html>
