<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damm · Escucha Activa</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>

<body class="pagina-encuestas">

  <!-- Cabecera -->
  <header class="site-header">
    <div class="container">
      <div style="display: flex; align-items: baseline; gap: 0.75rem;">
        <a href="/" class="brand">Damm</a>
        <span class="brand-badge">Escucha Activa</span>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link active">Encuestas</a></li>
          <li><a href="/crear.html" class="btn btn-primary">+ Nueva necesidad</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="main-content">
    <div class="container">

      <h1>Mis encuestas</h1>
      <p class="actividad-subtitulo" id="contador-encuestas">Cargando tus encuestas…</p>

      <!-- Aviso de estado / error -->
      <div id="mensaje-estado" style="display: none;"></div>

      <div class="encuestas-grid" id="lista-encuestas">
        <!-- Tarjetas generadas por JS -->
      </div>

    </div>
  </main>

  <!-- Script con llamada a api.js -->
  <script type="module" src="/js/layout.js"></script>
  <script type="module">
    import { listarEncuestas, formatearColectivo, formatearEstado } from '/js/api.js';

    const lista = document.getElementById('lista-encuestas');
    const contador = document.getElementById('contador-encuestas');
    const mensajeEstado = document.getElementById('mensaje-estado');

    const TARJETA_NUEVA = `
      <div class="encuesta-nueva">
        <p>Describe una necesidad y la IA te propondrá una microencuesta</p>
        <a href="/crear.html" class="btn btn-primary">Nueva necesidad</a>
      </div>`;

    function escapar(texto) {
      return String(texto ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function tarjeta(enc) {
      const id = encodeURIComponent(enc.id);
      const publicada = enc.estado === 'publicada';
      const enlace = publicada ? `/dashboard.html?id=${id}` : `/crear.html?id=${id}`;
      const acciones = publicada
        ? `<a href="/dashboard.html?id=${id}" class="btn btn-primary">Ver análisis</a>
           <a href="/responder/${id}?canal=qr" class="btn btn-secondary">Formulario</a>`
        : `<a href="/crear.html?id=${id}" class="btn btn-primary">${enc.estado === 'aprobada' ? 'Publicar' : 'Revisar y aprobar'}</a>`;
      return `
        <article class="encuesta-tarjeta">
          <div class="encuesta-tarjeta-meta">
            <span>${escapar(formatearColectivo(enc.colectivo))}</span>
            <span class="badge badge-${escapar(enc.estado)}">${escapar(formatearEstado(enc.estado))}</span>
          </div>
          <a href="${enlace}" class="encuesta-tarjeta-titulo">${escapar(enc.titulo || 'Sin título')}</a>
          <div class="encuesta-tarjeta-datos">
            <div><strong>${enc.n_respuestas ?? 0}</strong>respuestas</div>
            <div><strong>${escapar(enc.periodo || '-')}</strong>periodo</div>
          </div>
          <div class="encuesta-tarjeta-acciones">${acciones}</div>
        </article>`;
    }

    async function cargar() {
      try {
        const encuestas = await listarEncuestas();
        if (!encuestas || encuestas.length === 0) {
          contador.textContent = 'Todavía no hay encuestas. Empieza describiendo una necesidad.';
          lista.innerHTML = TARJETA_NUEVA;
          return;
        }
        contador.textContent = `${encuestas.length} encuesta${encuestas.length === 1 ? '' : 's'} · resultados siempre agregados y anónimos.`;
        lista.innerHTML = TARJETA_NUEVA + encuestas.map(tarjeta).join('');
      } catch (err) {
        console.error('Error al cargar encuestas:', err);
        contador.textContent = 'No se pudieron cargar las encuestas.';
        mensajeEstado.style.display = 'block';
        mensajeEstado.innerHTML = `
          <div class="alerta">
            <div>
              <div class="alerta-tipo">Error de conexión</div>
              <div class="alerta-mensaje">${escapar(err.message || 'No se pudieron cargar las encuestas')}</div>
            </div>
          </div>`;
        lista.innerHTML = TARJETA_NUEVA;
      }
    }

    cargar();
  </script>
</body>

</html>
